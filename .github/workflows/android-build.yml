name: Android CI & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create .env from GitHub secrets (optional overrides)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          # Keep a repository-provided .env; use template defaults only when .env is absent.
          if [ ! -f .env ]; then cp .env.example .env; fi
          [ -n "$SUPABASE_URL" ] && sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env
          [ -n "$SUPABASE_ANON_KEY" ] && sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env
          if [ -n "$AGORA_APP_ID" ]; then
            if grep -q '^AGORA_APP_ID=' .env; then
              sed -i "s|^AGORA_APP_ID=.*|AGORA_APP_ID=$AGORA_APP_ID|" .env
            else
              echo "AGORA_APP_ID=$AGORA_APP_ID" >> .env
            fi
          fi
          true

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --continue || true

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viora-app-debug
          path: app/build/outputs/apk/debug/*.apk
